[project]
name = "cosmos-backend"
version = "1.0.0"
description = "COSMOS — exoplanet catalogue API with explainable habitability analysis"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the documented idiom
    "E501",  # long lines are usually prose in docstrings; the formatter handles code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # conftest must set env vars before importing the app
